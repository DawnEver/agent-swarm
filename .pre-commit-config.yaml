repos:
  - repo: https://example.invalid/upstream
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-toml

  - repo: local
    hooks:
      - id: commit-message
        stages: [commit-msg]
      - id: the-suite
        name: the whole suite
        stages: [pre-push]
      - id: bump-version
        stages: [pre-push]
