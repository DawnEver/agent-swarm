[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-swarm"
version = "0.1.0"
description = "L1 job layer: store adapters, job model, atomic claim, admission, lifecycles"
requires-python = ">=3.11"
# NO RUNTIME DEPENDENCIES, and that is a design constraint rather than a happy accident. This layer
# decides; it does not reach. Facts arrive as arguments (fabric supplies them), stores arrive
# through adapters. The day something here needs a third-party package, check first whether the
# decision has quietly grown an I/O half that belongs in an adapter.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_swarm"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

# The quote style is DECLARED, not left to the default. Without this, running ruff from a sibling
# checkout picks up that project's config and rewrites every string in this one -- a diff of pure
# churn that buries the real change.
[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
# THE SUITE MUST TEST THIS TREE, and without this line it did not. `agent_swarm` is also INSTALLED
# into the interpreter that runs these tests (a pinned, non-editable copy, deliberately). With no
# `pythonpath`, `import agent_swarm` resolved to site-packages, so every offline run was a verdict
# about the PIN and not about the working tree -- green, plausible, and about the wrong code.
#
# Found by sabotage: two mutations were applied to `src/agent_swarm/provenance.py`, the suite was
# re-run, and it stayed green. The tests were not weak; they never saw the edit. This is the same
# shape as the index bug and the `0 ms` timing -- a working copy of a thing alibiing the copy under
# test -- and it is the one that makes the other two hard to trust, because it is the mechanism by
# which a revert-and-rerun proves nothing at all.
pythonpath = ["src"]
markers = [
    "live_forge: talks to a real forge over the network",
    "live_fabric: spawns a real LLM session on the fabric fleet (needs node)",
]
# A TIER, DESELECTED BY DEFAULT -- not the auto-skip that was refused. An auto-skip on a connection
# error is a disguise: the run that most needs to be loud (server down, token expired) would report
# green. Deselected tests still FAIL loudly when you ask for them with `pytest -m live_forge`,
# because by then you asked for the forge. And `tests/conftest.py` prints how many were skipped, so
# that "all green" and "no forge was ever contacted" cannot be confused -- deselection without that
# line would trade a wall of red for a silence, which is the worse of the two.
#
# THE SHARP EDGE OF THAT CHOICE, and it has already cost a real accidental live run:
# **a command-line `-m` REPLACES this expression, it does not intersect with it.** So
# `pytest -m "not live"` -- reaching for `-m` to NARROW a run -- silently WIDENS it into the live
# tier: real forge writes and real LLM sessions, from a flag whose author meant to exclude them.
# The marker names are `live_forge` and `live_fabric`; `live` matches neither, so the guard reads as
# satisfied while doing nothing.
#
# To narrow a default run, use `-k` or a path, never `-m`. To add a constraint on top of this one,
# spell the whole expression:  -m "not live_forge and not live_fabric and <yours>".
# `tests/conftest.py` prints how many live tests were deselected, which is the line that says
# immediately which of the two happened -- it is only silent when the answer is "none, they ran".
addopts = ["-m", "not live_forge and not live_fabric"]
